const frame=document.getElementById('frame');
let cur=null, busy=false;

function decode(b64){
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// 剧情自动流转：淡出 → 换新页 → 淡入
function go(key){
  if(!PAGES[key]||key===cur||busy)return;
  busy=true; cur=key;
  frame.classList.remove('show');
  setTimeout(()=>{
    // onload 必须在 srcdoc 赋值之前绑定，否则可能错过 load 事件导致 busy 卡死
    frame.onload=()=>{ frame.classList.add('show'); setTimeout(()=>{busy=false},260); };
    frame.srcdoc=decode(PAGES[key]);
    // 兜底：万一 load 未触发，也要解锁
    setTimeout(()=>{ frame.classList.add('show'); busy=false; },1600);
  },560);
}

// 背景音乐：主页发起，外壳持有 audio，切页时不断；不循环，播完即止
const bgm=document.getElementById('bgm');
function playBgm(){
  const p=bgm.play();
  if(p&&p.catch)p.catch(()=>{
    // 浏览器未授予自动播放权限时，先静音起播再解除静音
    bgm.muted=true;
    const q=bgm.play();
    if(q&&q.then)q.then(()=>{bgm.muted=false}).catch(()=>{});
  });
}

// 各环节在动作完成后主动上报，外壳据此推进剧情
addEventListener('message',e=>{
  const d=e.data;
  if(d&&d.type==='wb-audio'){
    if(d.action==='play')playBgm();
    else if(d.action==='pause')bgm.pause();
    return;
  }
  if(d&&d.type==='wb-goto'&&PAGES[d.key]) go(d.key);
});

// 固定从倒计时开场，保证整条剧情每次完整播放
go('countdown');
</script>
